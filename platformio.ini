[platformio]
default_envs = tdisplay

[env:tdisplay]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

; TENSTAR / LilyGO T-Display: original ESP32, 16MB flash, CH9102F USB bridge
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs

upload_port = COM7
upload_speed = 921600
monitor_port = COM7
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@2.5.43

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; ---- TFT_eSPI setup (replaces User_Setup.h) ----
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=1
    -DLOAD_GLCD=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000
