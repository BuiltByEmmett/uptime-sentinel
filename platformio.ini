; Uptime Sentinel - one [env] per supported board.
;
;   pio run -e <name> -t upload
;
; name            board                                         status
; --------------  --------------------------------------------  ---------------
; tdisplay        LilyGO / TENSTAR T-Display, 16MB flash        tested on hardware
; tdisplay-4mb    LilyGO T-Display, 4MB flash                   same code, builds
; tdisplay-s3     LilyGO T-Display-S3 (320x170)                 builds, untested
; cyd             Cheap Yellow Display ESP32-2432S028R          builds, untested
; cyd2usb         CYD with two USB ports (ST7789 panel)         builds, untested
; esp32-headless  any ESP32 dev board, no screen                builds
; esp32s3-headless  any ESP32-S3 dev board, no screen           builds
; esp32c3-headless  any ESP32-C3 dev board, no screen           builds
; wt32-eth01      Wireless-Tag WT32-ETH01, Ethernet, no screen  builds, untested
; esp32-poe       Olimex ESP32-POE, Ethernet, no screen         builds, untested
;
; Every build has two firmware slots, so all of them can be updated from the
; dashboard. To add a board, copy the closest block and change the pins. The options
; are described in src/board.h.

[platformio]
default_envs = tdisplay

[env]
platform = espressif32@6.9.0
framework = arduino
board_build.filesystem = littlefs
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Also writes firmware-full.bin (bootloader + partitions + app in one file).
extra_scripts = post:tools/merge_firmware.py
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; The build name is compiled in, so a firmware update for the wrong
    ; board can be refused.
    '-DBOARD_ENV="${PIOENV}"'

; ---- shared pieces --------------------------------------------------------

[display]
lib_deps =
    bodmer/TFT_eSPI@2.5.43
build_flags =
    ${env.build_flags}
    -DUSER_SETUP_LOADED=1
    -DLOAD_GLCD=1
    -DLOAD_GFXFF=1

[tdisplay]
build_flags =
    ${display.build_flags}
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000
    -DSCREEN_W=240
    -DSCREEN_H=135
    -DBTN1_PIN=0
    -DBTN2_PIN=35

[cyd]
build_flags =
    ${display.build_flags}
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=1
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSCREEN_W=320
    -DSCREEN_H=240
    -DUI_SCALE_NUM=4
    -DUI_SCALE_DEN=3
    -DBTN1_PIN=0
    -DTOUCH_IRQ_PIN=36

; ---- boards with a screen -------------------------------------------------

[env:tdisplay]
board = esp32dev
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_16mb.csv
lib_deps = ${display.lib_deps}
build_flags = ${tdisplay.build_flags}

[env:tdisplay-4mb]
board = esp32dev
board_build.partitions = min_spiffs.csv
lib_deps = ${display.lib_deps}
build_flags = ${tdisplay.build_flags}

[env:tdisplay-s3]
board = lilygo-t-display-s3
lib_deps = ${display.lib_deps}
build_flags =
    ${display.build_flags}
    -DST7789_DRIVER=1
    -DINIT_SEQUENCE_3=1
    -DCGRAM_OFFSET=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=1
    -DSCREEN_W=320
    -DSCREEN_H=170
    -DUI_SCALE_NUM=5
    -DUI_SCALE_DEN=4
    -DBTN1_PIN=0
    -DBTN2_PIN=14
    -DPOWER_ON_PIN=15

[env:cyd]
board = esp32dev
board_build.partitions = min_spiffs.csv
lib_deps = ${display.lib_deps}
build_flags =
    ${cyd.build_flags}
    -DILI9341_2_DRIVER=1

[env:cyd2usb]
board = esp32dev
board_build.partitions = min_spiffs.csv
lib_deps = ${display.lib_deps}
build_flags =
    ${cyd.build_flags}
    -DST7789_DRIVER=1
    -DTFT_INVERSION_OFF=1
    -DTFT_RGB_ORDER=TFT_BGR

; ---- no screen: serial log and Discord only -------------------------------

[env:esp32-headless]
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DHEADLESS=1
    -DBTN1_PIN=0

[env:esp32s3-headless]
board = esp32-s3-devkitc-1
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DHEADLESS=1
    -DBTN1_PIN=0

[env:esp32c3-headless]
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DHEADLESS=1
    -DBTN1_PIN=9

; ---- no screen, wired network port ----------------------------------------
; Ethernet is used while its cable is linked, WiFi otherwise. The PHY pins
; come from the board definition; see HAS_ETH in src/board.h.

; No USB port and no button: flash it through a USB-serial adapter, and
; reflash to wipe its settings. GPIO0 carries the Ethernet clock.
[env:wt32-eth01]
board = wt32-eth01
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DHEADLESS=1
    -DHAS_ETH=1
    -DBTN1_PIN=-1

[env:esp32-poe]
board = esp32-poe
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DHEADLESS=1
    -DHAS_ETH=1
    -DBTN1_PIN=34
